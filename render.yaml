# Background worker for the BullMQ queues. The web app and API run on Vercel (see vercel.json).
services:
  - type: worker
    name: jobpilot-worker
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://job-pilot-alpha-six.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
