# BullMQ worker, run as a free web service (free tier has no background workers). It serves a health
# endpoint and pings itself every 10 minutes so Render doesn't spin it down. The web app and API run on Vercel (see vercel.json).
services:
  - type: web
    name: jobpilot-worker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    healthCheckPath: /
    startCommand: npm run start:worker -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://job-pilot-alpha-six.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
